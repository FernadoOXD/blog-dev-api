services:
  postgres:
    image: postgres:16-alpine
    container_name: blog_engine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: blog_pass
      POSTGRES_DB: blog_cms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog_user -d blog_cms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: